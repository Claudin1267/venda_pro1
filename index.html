<script>
// CHAVE E CRIPTOGRAFIA (Web Crypto)
const SEC_KEY = 'cocada_secure_v1'; // chave localStorage onde armazenamos o blob cifrado
const LEGACY_KEYS = { sales:'cocada_sales_v3', routes:'cocada_routes_v3', config:'cocada_config_v3' };

function randomBytes(len){ const b=new Uint8Array(len); crypto.getRandomValues(b); return b; }
function bufToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuf(b64){ const s=atob(b64); const arr=new Uint8Array(s.length); for(let i=0;i<s.length;i++) arr[i]=s.charCodeAt(i); return arr.buffer; }

async function deriveKey(password, saltUint8) {
  const pwUtf8 = new TextEncoder().encode(password);
  const baseKey = await crypto.subtle.importKey('raw', pwUtf8, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltUint8, iterations: 150000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encryptJSON(obj, password){
  const salt = randomBytes(16);
  const iv = randomBytes(12);
  const key = await deriveKey(password, salt);
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return JSON.stringify({ v:1, salt: bufToBase64(salt), iv: bufToBase64(iv), ct: bufToBase64(ct) });
}

async function decryptJSON(payloadStr, password){
  const payload = JSON.parse(payloadStr);
  if(!payload || !payload.ct) throw new Error('Formato inválido');
  const salt = new Uint8Array(base64ToBuf(payload.salt));
  const iv = new Uint8Array(base64ToBuf(payload.iv));
  const ct = base64ToBuf(payload.ct);
  const key = await deriveKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

async function saveEncryptedStateUsing(password){
  const clone = { sales: state.sales, routes: state.routes, config: state.config };
  const blob = await encryptJSON(clone, password);
  localStorage.setItem(SEC_KEY, blob);
}

async function loadEncryptedStateUsing(password){
  const blob = localStorage.getItem(SEC_KEY);
  if(!blob) throw new Error('Nenhum armazenamento seguro encontrado');
  return await decryptJSON(blob, password);
}

// Estado inicial: se existe SEC_KEY, esperamos desbloquear; senão, carregamos dados legados (se houver)
let state;
if(localStorage.getItem(SEC_KEY)){

} else {

  };
}
